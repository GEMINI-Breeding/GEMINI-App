name: Build Desktop App

# The desktop app is a Tauri shell that runs the GEMINIbase stack in Docker
# (src-tauri/src/stack.rs); there is no bundled backend any more.
#
# Platforms (D6): Windows x64, macOS Apple silicon, Linux x64 + arm64 (built
# on ubuntu-22.04 — the oldest supported glibc — so the .deb runs on 22.04,
# 24.04 and 26.04).
#
# Signing (D10, same accounts as Phytograph). Every signing step is skipped
# when its secrets are absent (forks, PRs, before setup), and a verify step
# fails the job if a build that should be signed isn't.
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific),
#            APPLE_TEAM_ID — Tauri's bundler signs, notarizes and staples.
#   Windows: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (secrets)
#            and AZURE_CERTIFICATE_PROFILE (repo variable: this app's
#            certificate profile in the GitHubPackageSigning account).
#
# Tags v* also create a draft GitHub release with the installers and
# SHA256SUMS; publish it by hand after checking it.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "frontend/**"
      - "backend"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "frontend/src-tauri/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            artifacts: frontend/src-tauri/target/release/bundle/deb/*.deb
          - os: ubuntu-22.04-arm
            name: linux-arm64
            artifacts: frontend/src-tauri/target/release/bundle/deb/*.deb
          - os: macos-14
            name: macos-arm64
            artifacts: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-2022
            name: windows-x86_64
            artifacts: frontend/src-tauri/target/release/bundle/inno/*.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 150 # headroom for Apple's notary queue
    env:
      # Secrets can't be tested in `if:` directly.
      HAS_APPLE: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
      - name: Checkout (with the GEMINIbase submodule — its compose file ships)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="$(jq -r .version frontend/src-tauri/tauri.conf.json)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v' frontend/src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" frontend/src-tauri/tauri.conf.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          prefix-key: "v3"

      - name: Rust unit tests (stack manager)
        working-directory: frontend/src-tauri
        run: cargo test --locked

      # ── macOS ────────────────────────────────────────────────────────────
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: frontend
        env:
          # No secrets → ad-hoc signature ("-"): runs after right-click →
          # Open, instead of the "app is damaged" Gatekeeper error.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty secret still sets the variable, and Tauri then tries to
          # import an empty certificate; pass only the ones that are set.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          npx tauri build --ci

      - name: Verify signature and notarization (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=$(ls -d frontend/src-tauri/target/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$HAS_APPLE" != "true" ]; then
            echo "::warning::Not signed: APPLE_* secrets are not set (ad-hoc build)."
            exit 0
          fi
          codesign -dvv "$app" 2>&1 | tee /dev/stderr | grep -q "Authority=Developer ID Application"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"
          xcrun stapler validate "$app"

      # ── Linux ────────────────────────────────────────────────────────────
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: frontend
        env:
          NO_AT_BRIDGE: "1"
        run: npx tauri build --ci --bundles deb

      # ── Windows ──────────────────────────────────────────────────────────
      # Tauri builds the exe; Inno Setup makes the installer (same AppId as
      # v0.0.5, so it upgrades that install in place — D1).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: frontend
        run: npx tauri build --ci --no-bundle

      - name: Sign app.exe (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: GitHubPackageSigning
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: frontend/src-tauri/target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Create installer (Windows — Inno Setup)
        if: runner.os == 'Windows'
        working-directory: frontend/src-tauri
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" inno-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer (Windows)
        if: runner.os == 'Windows' && env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: GitHubPackageSigning
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: frontend/src-tauri/target/release/bundle/inno
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:HAS_AZURE -ne "true") {
            Write-Output "::warning::Not signed: AZURE_* secrets are not set."
            exit 0
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $files = @("frontend\src-tauri\target\release\app.exe") +
            (Get-ChildItem frontend\src-tauri\target\release\bundle\inno\*.exe).FullName
          foreach ($f in $files) {
            # /tw: a missing timestamp is fatal — the certificate lives 72 h.
            & $signtool.FullName verify /pa /all /tw $f
            if ($LASTEXITCODE -ne 0) { throw "signature check failed: $f" }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gemi-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
